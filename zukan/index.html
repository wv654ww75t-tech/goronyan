<style>
/* Layout: 図鑑の標本プレートを並べたカード帳。上に集計、下にプレートの格子。仕分けは1枚ずつめくる札。 */
:root{
  --bg:#f8f3ea;          /* アイボリー */
  --paper:#fffdf8;
  --ink:#3b2a22;         /* こげ茶 */
  --ink-soft:#7b6558;
  --line:#e6d9c7;
  --brown:#6b4330;
  --red:#a8323a;         /* 赤（アクセント） */
  --sky:#a9cfe0;         /* 淡い水色 */
  --sky-ink:#2f6b85;
  --keep:#3f7a5a; --keep-bg:#e3f0e6;
  --maybe:#a8742a; --maybe-bg:#f7ead2;
  --let:#a8323a; --let-bg:#f6e0e0;
  --none:#7b6558; --none-bg:#efe7dc;
  --shadow:0 1px 2px rgba(59,42,34,.08),0 6px 18px rgba(59,42,34,.06);
  --pat:rgba(107,67,48,.08);
  --f-display:"Kiwi Maru","Hiragino Maru Gothic ProN","Zen Maru Gothic",serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-num:"Kiwi Maru","Hiragino Maru Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211813;--paper:#2c211b;--ink:#f1e6d8;--ink-soft:#c2ad9b;--line:#45362c;--brown:#d6a888;--red:#e07a80;--sky:#4f7f95;--sky-ink:#a9d6ea;
  --keep:#8fcfa9;--keep-bg:#26382d;--maybe:#e7bd78;--maybe-bg:#3d3122;--let:#ef9aa0;--let-bg:#43272a;--none:#c2ad9b;--none-bg:#3a2e26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--pat:rgba(214,168,136,.08);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211813;--paper:#2c211b;--ink:#f1e6d8;--ink-soft:#c2ad9b;--line:#45362c;--brown:#d6a888;--red:#e07a80;--sky:#4f7f95;--sky-ink:#a9d6ea;
  --keep:#8fcfa9;--keep-bg:#26382d;--maybe:#e7bd78;--maybe-bg:#3d3122;--let:#ef9aa0;--let-bg:#43272a;--none:#c2ad9b;--none-bg:#3a2e26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--pat:rgba(214,168,136,.08);color-scheme:dark}
/* きせかえ：選んだら端末の昼夜に関係なくその色で固定（属性なし＝端末に合わせる） */
html:root[data-skin]{
  --ink:#3b2a22;--ink-soft:#7b6558;--red:#a8323a;--sky-ink:#2f6b85;
  --keep:#3f7a5a;--keep-bg:#e3f0e6;--maybe:#a8742a;--maybe-bg:#f7ead2;--let:#a8323a;--let-bg:#f6e0e0;--none:#7b6558;--none-bg:#efe7dc;
  --shadow:0 1px 2px rgba(59,42,34,.08),0 6px 18px rgba(59,42,34,.06);color-scheme:light}
html:root[data-skin="ivory"]{--bg:#f8f3ea;--paper:#fffdf8;--line:#e6d9c7;--brown:#6b4330;--sky:#a9cfe0;--pat:rgba(107,67,48,.08)}
html:root[data-skin="sora"]{--bg:#e6f1f7;--paper:#fbfdff;--line:#cadfea;--brown:#3d6c84;--sky:#f2d3db;--ink:#2e3a42;--ink-soft:#5f7380;--pat:rgba(61,108,132,.10)}
html:root[data-skin="sakura"]{--bg:#fbecef;--paper:#fffafb;--line:#efd3da;--brown:#9a4a5c;--sky:#cde3ec;--pat:rgba(154,74,92,.09)}
html:root[data-skin="lavender"]{--bg:#f0ebf8;--paper:#fdfcff;--line:#dcd3ec;--brown:#674f91;--sky:#d6eaf2;--ink:#33293f;--ink-soft:#6c6080;--pat:rgba(103,79,145,.09)}
html:root[data-skin="classic"]{--bg:#ede0cd;--paper:#fbf5ec;--line:#d6c1a3;--brown:#5a3524;--red:#982a33;--sky:#b8d3df;--pat:rgba(90,53,36,.09)}
html:root[data-skin="choco"]{--bg:#2b1d16;--paper:#37271f;--ink:#f3e7d7;--ink-soft:#c9b29d;--line:#4c392d;--brown:#e2b48f;--red:#e58a8f;--sky:#5b8aa0;--sky-ink:#b5dcee;
  --keep:#8fcfa9;--keep-bg:#26382d;--maybe:#e7bd78;--maybe-bg:#3d3122;--let:#ef9aa0;--let-bg:#43272a;--none:#c9b29d;--none-bg:#3a2e26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--pat:rgba(226,180,143,.08);color-scheme:dark}
html[data-pat="dots"] body{background-image:radial-gradient(var(--pat) 2px,transparent 2.4px);background-size:20px 20px}
html[data-pat="gingham"] body{background-image:linear-gradient(90deg,var(--pat) 50%,transparent 50%),linear-gradient(var(--pat) 50%,transparent 50%);background-size:28px 28px}
html[data-pat="quilt"] body{background-image:repeating-linear-gradient(45deg,transparent 0 24px,var(--pat) 24px 25.5px),repeating-linear-gradient(-45deg,transparent 0 24px,var(--pat) 24px 25.5px)}
html[data-pat="stripe"] body{background-image:repeating-linear-gradient(90deg,transparent 0 18px,var(--pat) 18px 30px)}
html[data-pat="lace"] body{background-image:radial-gradient(circle at 50% 0,transparent 9px,var(--pat) 9.5px 11px,transparent 11.5px),radial-gradient(var(--pat) 1.6px,transparent 2px);background-size:24px 24px,24px 24px;background-position:0 0,12px 14px}
*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.hd-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.kisekae{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--ink)}
.kisekae span{color:var(--red)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sw{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px}
.sw[aria-pressed="true"]{border-color:var(--brown);box-shadow:inset 0 0 0 1.5px var(--brown)}
.sw .dot{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:grid;place-items:center;font-size:15px}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.pt{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px}
.pt[aria-pressed="true"]{border-color:var(--brown);box-shadow:inset 0 0 0 1.5px var(--brown)}
.pt .tile{width:100%;height:46px;border-radius:8px;background-color:var(--bg);border:1px solid var(--line)}
.pt .tile.dots{background-image:radial-gradient(var(--pat) 2px,transparent 2.4px);background-size:14px 14px}
.pt .tile.gingham{background-image:linear-gradient(90deg,var(--pat) 50%,transparent 50%),linear-gradient(var(--pat) 50%,transparent 50%);background-size:18px 18px}
.pt .tile.quilt{background-image:repeating-linear-gradient(45deg,transparent 0 12px,var(--pat) 12px 13.5px),repeating-linear-gradient(-45deg,transparent 0 12px,var(--pat) 12px 13.5px)}
.pt .tile.stripe{background-image:repeating-linear-gradient(90deg,transparent 0 10px,var(--pat) 10px 17px)}
.pt .tile.lace{background-image:radial-gradient(circle at 50% 0,transparent 6px,var(--pat) 6.5px 8px,transparent 8.5px),radial-gradient(var(--pat) 1.4px,transparent 1.8px);background-size:16px 16px,16px 16px;background-position:0 0,8px 9px}
.kz-sec{display:grid;gap:8px;margin-bottom:16px}
.kz-sec h3{margin:0;font-size:13px;color:var(--ink-soft);font-weight:500;letter-spacing:.04em}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky-ink);outline-offset:2px}

header.top{display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{--g1:#7a5a24;--g2:#c9a55a;--g3:#f0dc9e;position:relative;isolation:isolate;text-align:center;padding:16px 38px 14px;margin:30px 0 18px;border:4px double var(--g2);border-radius:6px;background:linear-gradient(var(--paper),var(--paper)) padding-box;box-shadow:0 0 0 5px var(--paper),0 0 0 7px var(--g2),0 0 0 9px var(--paper),0 0 0 10px color-mix(in srgb,var(--g2) 60%,transparent),0 10px 30px rgba(122,90,36,.25)}
.brand .rays{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;background:repeating-conic-gradient(from 0deg,var(--g2) 0deg 2.2deg,transparent 2.2deg 7.5deg);-webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 75%);mask-image:radial-gradient(closest-side,#000 25%,transparent 75%);opacity:.55}
.brand .spark{position:absolute;color:var(--g2);font-size:14px;line-height:1;pointer-events:none}
.brand .s1{top:-30px;left:6%}.brand .s2{top:-18px;right:4%;font-size:10px}.brand .s3{bottom:-26px;right:12%}.brand .s4{bottom:-20px;left:2%;font-size:10px}
@media (prefers-reduced-motion:no-preference){.brand .spark{animation:tw 2.6s ease-in-out infinite}.brand .s2{animation-delay:.7s}.brand .s3{animation-delay:1.3s}.brand .s4{animation-delay:1.9s}@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
.brand h1{background-size:100% 100%,250% 100%!important;animation:shine 4.5s ease-in-out infinite}@keyframes shine{0%,60%{background-position:0 0,160% 0}100%{background-position:0 0,-60% 0}}}
.brand::before,.brand::after{content:"❦";position:absolute;top:50%;transform:translateY(-50%);color:var(--g2);font-size:20px;line-height:1}
.brand::before{left:8px;transform:translateY(-50%) scaleX(-1)}.brand::after{right:8px}
.brand .crest{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 8px;color:var(--red);font-size:18px;line-height:1.3}
.brand small{display:block;font-family:"Cormorant Garamond","Times New Roman",serif;font-style:italic;font-weight:500;color:var(--g1);letter-spacing:.14em;font-size:14px}
.brand h1{margin:0;font-family:"Zen Antique","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;font-size:clamp(34px,10vw,46px);letter-spacing:.14em;line-height:1.25;padding-left:.14em;background-image:linear-gradient(180deg,var(--g3) 0%,var(--g2) 38%,var(--g1) 60%,var(--g2) 82%,var(--g3) 100%),linear-gradient(105deg,transparent 40%,rgba(255,250,230,.9) 50%,transparent 60%);background-blend-mode:screen;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(60,35,10,.35))}
.brand .flour{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--g2);font-size:12px;margin-top:2px}
.brand .flour i{display:block;width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 16px;border-radius:999px;font-family:var(--f-display);color:var(--ink-soft)}
.tabs button[aria-pressed="true"]{background:var(--brown);color:var(--paper)}

.summary{margin-top:28px;display:grid;gap:10px}
.summary h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;text-align:center;letter-spacing:.08em}
.summary h2::before,.summary h2::after{content:"✿";color:var(--red);font-size:.75em;margin:0 .6em;vertical-align:.1em}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--none-bg);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.tally{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tally button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.tally button[aria-pressed="true"]{border-color:var(--brown);box-shadow:inset 0 0 0 1px var(--brown)}
.tally b{display:block;font-family:var(--f-num);font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em;white-space:nowrap}
.tally .k b{color:var(--keep)} .tally .m b{color:var(--maybe)} .tally .l b{color:var(--let)} .tally .n b{color:var(--none)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px}
.index{display:flex;flex-wrap:nowrap;gap:4px;margin:18px 0 0;padding:6px 14px 0 10px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.index::-webkit-scrollbar{display:none}
.index button{flex:none;border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:12px 12px 0 0;padding:7px 14px 6px;font-size:13.5px;color:var(--ink-soft);font-family:var(--f-display);position:relative;top:1px;white-space:nowrap}
.index button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--brown);border-width:1.5px;z-index:1}
.index button[aria-pressed="true"]::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:var(--red);opacity:.75}
.page{position:relative;background:var(--paper);border:1.5px solid var(--brown);border-radius:4px 18px 18px 18px;padding:20px 14px 22px;box-shadow:var(--shadow)}
.page::after{content:"";position:absolute;inset:6px;border:1px dashed var(--line);border-radius:2px 13px 13px 13px;pointer-events:none}
.page-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.page-head h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.06em;padding-top:4px}
.page-head h2 small{font-size:12px;color:var(--ink-soft);margin-left:8px;letter-spacing:.02em}
.page-head .pg{font-family:var(--f-num);color:var(--brown);font-size:13px}
details.narrow{position:relative;z-index:1;margin-top:10px}
details.narrow summary{cursor:pointer;font-size:13px;color:var(--brown);list-style:none;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg)}
details.narrow summary::-webkit-details-marker{display:none}
details.narrow summary::after{content:"▾";font-size:11px}
details.narrow[open] summary::after{content:"▴"}
details.narrow .in{display:grid;gap:10px;padding-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px;position:relative;z-index:1}
.pager button{border:0;background:none;color:var(--brown);font-family:var(--f-display);font-size:13px;padding:4px 2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager button:disabled{visibility:hidden}
.swipe-hint{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:6px;position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){.page.in-r{animation:inr .25s ease-out}.page.in-l{animation:inl .25s ease-out}
@keyframes inr{from{transform:translateX(30px);opacity:.4}}@keyframes inl{from{transform:translateX(-30px);opacity:.4}}}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--ink)}
.chip i{font-style:normal;font-family:var(--f-num);margin-left:4px;font-size:12px}
select.sort{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 8px;margin-top:14px;position:relative;z-index:1}
.grid.c1{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px 16px}
.grid.c1 .plate{max-width:380px;margin:0 auto;width:100%}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px 4px}
.grid.c3 .meta,.grid.c3 .pill{display:none}
.grid.c3 .nameplate{padding:4px 6px 5px}.grid.c3 .nameplate b{font-size:12px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 4px}.grid.c1{grid-template-columns:1fr}.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 2px}.page{padding-left:8px;padding-right:8px}.page-head,details.narrow{padding:0 6px}}
.head-r{display:flex;align-items:center;gap:10px}
.sizes{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--bg);padding:2px}
.sizes button{border:0;background:none;border-radius:999px;padding:4px 9px;font-size:12px;color:var(--ink-soft);font-family:var(--f-display);line-height:1.2}
.sizes button[aria-pressed="true"]{background:var(--brown);color:var(--paper)}
.nameplate{--g1:#7a5a24;--g2:#c9a55a;--g3:#f0dc9e;width:86%;margin:-4px auto 0;padding:5px 8px 6px;border-radius:3px;text-align:center;background:linear-gradient(180deg,var(--g3),var(--g2) 45%,#b08a43 55%,var(--g3));border:1px solid var(--g1);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(90,60,20,.35),0 2px 4px rgba(60,40,15,.25);position:relative}
.nameplate::before,.nameplate::after{content:"";position:absolute;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:#7a5a24;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.nameplate::before{left:5px}.nameplate::after{right:5px}
.nameplate small{display:block;font-family:var(--f-num);font-size:10px;letter-spacing:.12em;color:#5a3f15;opacity:.85;line-height:1.2}
.nameplate b{display:block;font-family:var(--f-display);font-weight:500;font-size:14px;line-height:1.5;padding-bottom:1px;color:#3d2a0e;text-shadow:0 1px 0 rgba(255,245,215,.6);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid.c1 .nameplate b{font-size:17px}.grid.c1 .nameplate small{font-size:11.5px}
.plate .sub{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:2px}
.plate{position:relative;background:transparent;border:0;border-radius:14px;padding:0 0 6px;text-align:center;align-items:stretch;display:flex;flex-direction:column;gap:6px;min-width:0}
.plate:hover .frm{filter:drop-shadow(0 4px 8px rgba(40,25,15,.32))}
.gf{position:relative;width:100%;max-width:100%;aspect-ratio:890/1124;margin:0 auto}
.gf .pic{position:absolute;left:19.6%;top:38.8%;width:60.8%;height:45.8%;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--ink-soft);font-family:var(--f-display);font-size:clamp(18px,7vw,30px)}
.gf .pic img{width:100%;height:100%;object-fit:cover;display:block}
.gf .pic::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 10px rgba(40,25,15,.35);pointer-events:none}
.gf .frm{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(40,25,15,.22))}

<script>
const PAGES=["all","ぬい","推しグッズ","文房具","コスメ","服・小物","本・CD","インテリア雑貨","キッチン","その他"];
const LABEL=c=>({all:"ぜんぶ","推しグッズ":"グッズ","インテリア雑貨":"雑貨"})[c]||c;
const CATS=["ぬい","推しグッズ","文房具","コスメ","服・小物","本・CD","インテリア雑貨","キッチン","その他"];
const JUDGE={none:"未判定",keep:"いる",maybe:"まよい中",let:"いらない"};
const SHOWN={display:"飾ってる",stored:"しまってる",use:"ふだん使い"};
const state={pmode:"cat",items:[],filter:{cat:"all",place:"all",judge:"all",shown:"all",q:""},sort:"no",tab:"zukan",mode:"loading",db:null,col:null,assets:null,sortQueue:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n||0).padStart(3,"0");
const live=()=>state.items.filter(i=>!i.grad&&!i.wish);
function similar(d){const nm=String(d.name||"").replace(/[\s（）()・、。!！?？]/g,"");const grams=new Set();for(let i=0;i<nm.length-1;i++)grams.add(nm.slice(i,i+2));
  return live().filter(i=>{if(i.id===d.id)return false;if(d.series&&i.series&&i.series.trim()===d.series.trim()&&i.cat===d.cat)return true;
    const n2=String(i.name||"");let hit=0;grams.forEach(g=>{if(n2.includes(g))hit++});return grams.size&&hit>=Math.min(2,grams.size)}).slice(0,8)}
function placeList(){const ps=[...new Set(live().map(i=>(i.place||"").trim()))];const named=ps.filter(Boolean).sort((a,b)=>a.localeCompare(b,"ja"));return ["all",...named,...(ps.includes("")&&named.length?["__none"]:[])]}
const pages=()=>state.pmode==="place"?placeList():PAGES;
function curKey(){if(state.pmode!=="place")return state.filter.cat;if(!placeList().includes(state.filter.place))state.filter.place="all";return state.filter.place}
function setKey(k){if(state.pmode==="place")state.filter.place=k;else state.filter.cat=k}
const pLabel=k=>state.pmode==="place"?(k==="all"?"ぜんぶ":k==="__none"?"場所なし":k):LABEL(k);
const monthOf=it=>it.wish?"":it.since||(it.created?new Date(it.created).toISOString().slice(0,7):"");
const imgSrc=it=>it.photo?("/_blob/"+it.photo):(it.photoData||"");

/* ---------- きせかえ ---------- */
const SKINS=[["auto","端末に合わせる","linear-gradient(135deg,#f8f3ea 50%,#211813 50%)","夜は暗くなる"],["ivory","アイボリー","#f8f3ea"],["sora","そら","#e6f1f7"],["sakura","さくら","#fbecef"],["lavender","ラベンダー","#f0ebf8"],["classic","クラシック","#ede0cd"],["choco","ショコラ","#2b1d16"]];
const PATS=[["none","むじ"],["dots","水玉"],["gingham","ギンガム"],["quilt","キルティング"],["stripe","ストライプ"],["lace","レース"]];
const SKEY="ouchi-zukan-look";
let look={skin:"ivory",pat:"none",cols:2};
try{const v=JSON.parse(localStorage.getItem(SKEY)||"null");if(v)look=v}catch(e){}
function applyLook(){const r=document.documentElement;
  if(look.skin==="auto")r.removeAttribute("data-skin");else r.setAttribute("data-skin",look.skin);
  if(look.pat==="none")r.removeAttribute("data-pat");else r.setAttribute("data-pat",look.pat)}
applyLook();
async function setLook(p){look={...look,...p};applyLook();try{localStorage.setItem(SKEY,JSON.stringify(look))}catch(e){}
  if(state.lookDoc){try{await state.lookDoc.set({skin:look.skin,pat:look.pat,cols:look.cols||2,limits:look.limits||{}})}catch(e){}}}
function openKisekae(){const root=$("#kzBox");
  const draw=()=>{root.innerHTML=`<div class="kz-page">
    <div class="kz-sec"><h3>いろ</h3><div class="swatches">${SKINS.map(([k,l,c,sub])=>`<button class="sw" data-skin="${k}" aria-pressed="${look.skin===k}"><span class="dot" style="background:${c}"></span>${l}${sub?`<small style="color:var(--ink-soft);font-size:10.5px;margin-top:-4px">${sub}</small>`:""}</button>`).join("")}</div></div>
    <div class="kz-sec"><h3>がら</h3><div class="pats">${PATS.map(([k,l])=>`<button class="pt" data-pat="${k}" aria-pressed="${look.pat===k}"><span class="tile ${k}"></span>${l}</button>`).join("")}</div></div>
    ${state.mode==="local"?`<div class="kz-sec"><h3>バックアップ（写真ごと保存できます）</h3><div class="backup"><button id="bk-out">ファイルに書き出す</button><label for="bk-in">ファイルから読みこむ</label><input id="bk-in" type="file" accept=".json,application/json"></div><small style="color:var(--ink-soft);font-size:11.5px">機種変更やデータの引っこしのときに使ってね。読みこむと、今ある図鑑に足されます</small></div>`:""}
    ${state.mode==="local"?"":`<p style="font-size:12px;color:var(--ink-soft);margin:0">どの端末で開いても同じきせかえになります</p>`}
  </div>`};
  draw();
  root.onsubmit=null;root.oninput=null;
  root.onchange=async e=>{if(e.target.id!=="bk-in"||!e.target.files[0])return;
    try{const data=JSON.parse(await e.target.files[0].text());const its=Array.isArray(data)?data:data.items;if(!Array.isArray(its))throw 0;
      let n=0;for(const it of its){if(it&&it.id&&it.name){await saveItem({...it});n++}}
      if(data.look){await setLook({...data.look});draw()}
      toast(`${n}こ読みこみました`)}catch(err){toast("このファイルは読みこめませんでした")}};
  root.onclick=async e=>{
    if(e.target.id==="bk-out"){const name=`おうち図鑑_${new Date().toISOString().slice(0,10)}.json`,blob=new Blob([JSON.stringify({app:"ouchi-zukan",v:1,at:Date.now(),look,items:state.items})],{type:"application/json"});
      try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(err){if(err&&err.name==="AbortError")return}
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return}
    const s=e.target.closest("[data-skin]");if(s&&s.classList.contains("sw")){setLook({skin:s.dataset.skin});draw();return}
    const p=e.target.closest(".pt");if(p){setLook({pat:p.dataset.pat});draw()}
  };
}

function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2200)}

/* ---------- 保存先 ---------- */
const LS="ouchi-zukan-items";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return []}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(state.items))}catch(e){toast("この端末には保存できませんでした")}}
/* スマホの中に保存（写真が多くても入るように IndexedDB） */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open("ouchi-zukan",1);r.onupgradeneeded=()=>r.result.createObjectStore("items",{keyPath:"id"});r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction("items",mode),st=t.objectStore("items");const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx("readonly",st=>st.getAll())},put(it){return this.tx("readwrite",st=>st.put(it))},del(id){return this.tx("readwrite",st=>st.delete(id))}};

async function boot(){
  render();
  const c=window.claude;
  if(!c||!c.use||window.ZUKAN_STANDALONE){useLocal();return}
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){useLocal();return}
    state.db=db;state.mode="db";
    state.col=db.collection("data/users/"+uid+"/zukan/items");
    state.lookDoc=db.doc("data/users/"+uid+"/zukan");
    state.lookDoc.get().then(s=>{const v=s.exists&&s.data();if(v&&v.skin){look={skin:v.skin,pat:v.pat||"none",cols:v.cols||look.cols||2,limits:v.limits||look.limits||{}};applyLook();render();try{localStorage.setItem(SKEY,JSON.stringify(look))}catch(e){}}}).catch(()=>{});
    c.use("assets").then(a=>{state.assets=a}).catch(()=>{});
    state.col.onSnapshot(snap=>{
      state.items=snap.docs.map(d=>({id:d.id,...d.data()}));
      state.loaded=true;render();
    },err=>{$("#status").textContent="読みこめませんでした。ページを開き直してください。"});
  }catch(e){useLocal()}
}
async function useLocal(){state.mode="local";
  try{await IDB.open();state.idb=true;let a=await IDB.all();
    const old=lsLoad();if(old.length){for(const it of old)if(!a.some(x=>x.id===it.id))await IDB.put(it);try{localStorage.removeItem(LS)}catch(e){}a=await IDB.all()}
    state.items=a||[]}catch(e){state.idb=false;state.items=lsLoad()}
  state.loaded=true;render()}

async function saveItem(it){
  it.updated=Date.now();
  if(state.mode==="db"){const {id,...body}=it;await state.col.doc(id).set(body)}
  else{const i=state.items.findIndex(x=>x.id===it.id);if(i>=0)state.items[i]=it;else state.items.push(it);
    if(state.idb)await IDB.put(it);else lsSave();render()}
}
async function removeItem(id){
  if(state.mode==="db"){await state.col.doc(id).delete()}
  else{state.items=state.items.filter(x=>x.id!==id);if(state.idb)await IDB.del(id);else lsSave();render()}
}
function newId(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nextNo(){return state.items.reduce((m,x)=>Math.max(m,x.no||0),0)+1}

/* 写真を小さくしてから保存 */
function shrink(file,max=1000){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement("canvas");
    cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);cv.toBlob(b=>b?res({blob:b,data:cv.toDataURL("image/jpeg",.7)}):rej(),"image/jpeg",.82)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}

/* ---------- 写真のトリミング ---------- */
const CROP_AR=541/515; /* 額縁の窓の形 */
function dataToBlob(u){const [h,b]=u.split(",");const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/:(.*?);/)||[])[1]||"image/jpeg"})}
function cropPhoto(src){return new Promise(resolve=>{
  const im=new Image();im.crossOrigin="anonymous";
  im.onerror=()=>{toast("この写真はトリミングできませんでした");resolve(null)};
  im.onload=()=>{
    const ov=document.createElement("div");ov.className="crop-ov";
    ov.innerHTML=`<div class="crop-box" role="dialog" aria-modal="true" aria-label="写真のトリミング">
      <p class="crop-t">指で動かして、額縁に入れたいところを合わせてね</p>
      <div class="crop-stage" id="cropStage"><img alt="" draggable="false"><div class="crop-mask"></div></div>
      <div class="crop-zoom"><span>小</span><input type="range" id="cropZ" min="1" max="4" step="0.01" value="1" aria-label="大きさ"><span>大</span></div>
      <div class="crop-btns"><button id="cropRot" type="button">↻ 回転</button><button id="cropNo" type="button">そのまま使う</button><button id="cropOk" type="button" class="btn-main">これでOK</button></div></div>`;
    document.body.appendChild(ov);
    const st=ov.querySelector("#cropStage"),img=st.querySelector("img"),zr=ov.querySelector("#cropZ");img.src=src;
    let rot=0,zoom=1,x=0,y=0;
    const dims=()=>{const W=st.clientWidth,H=st.clientHeight,r=rot%180!==0,w=r?im.naturalHeight:im.naturalWidth,h=r?im.naturalWidth:im.naturalHeight;return {W,H,w,h,base:Math.max(W/w,H/h)}};
    const clamp=()=>{const {W,H,w,h,base}=dims(),s=base*zoom,mx=Math.max(0,(w*s-W)/2),my=Math.max(0,(h*s-H)/2);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y))};
    const paint=()=>{clamp();const {W,H,base}=dims(),s=base*zoom;img.style.width=im.naturalWidth*s+"px";img.style.height=im.naturalHeight*s+"px";
      img.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${rot}deg)`};
    requestAnimationFrame(paint);
    const pts=new Map();let last=null,pinch=null;
    st.addEventListener("pointerdown",e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom}}else last={x:e.clientX,y:e.clientY}});
    st.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2&&pinch){const [a,b]=[...pts.values()];zoom=Math.min(4,Math.max(1,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));zr.value=zoom;paint()}
      else if(last){x+=e.clientX-last.x;y+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};paint()}});
    const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===1){const v=[...pts.values()][0];last={x:v.x,y:v.y}}else last=null};
    st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
    zr.oninput=()=>{zoom=+zr.value;paint()};
    const done=v=>{ov.remove();resolve(v)};
    ov.querySelector("#cropRot").onclick=()=>{rot=(rot+90)%360;x=0;y=0;paint()};
    ov.querySelector("#cropNo").onclick=()=>done(null);
    ov.querySelector("#cropOk").onclick=()=>{const {W,H,base}=dims(),s=base*zoom,OW=1000,OH=Math.round(OW*H/W),k=OW/W;
      const cv=document.createElement("canvas");cv.width=OW;cv.height=OH;const c=cv.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,OW,OH);
      c.translate(OW/2+x*k,OH/2+y*k);c.rotate(rot*Math.PI/180);const dw=im.naturalWidth*s*k,dh=im.naturalHeight*s*k;c.drawImage(im,-dw/2,-dh/2,dw,dh);
      try{cv.toBlob(b=>done(b?{blob:b,data:cv.toDataURL("image/jpeg",.8)}:null),"image/jpeg",.85)}catch(err){toast("この写真はトリミングできませんでした");done(null)}};
  };
  im.src=src})}

/* ---------- 描画 ---------- */
function gframe(it,src,lazy){return `<div class="gf"><div class="pic">${src?`<img src="${esc(src)}" alt=""${lazy?' loading="lazy"':""}>`:esc((it.name||"？").slice(0,1))}</div><img class="frm" src="frame-square.webp" alt=""></div>`}
function filtered(){
  const f=state.filter,q=f.q.trim().toLowerCase(),k=curKey(),pm=state.pmode==="place";
  let a=live().filter(it=>(pm?(k==="all"||(k==="__none"?!(it.place||"").trim():(it.place||"").trim()===k)):(k==="all"||it.cat===k))&&(f.judge==="all"||(it.judge||"none")===f.judge)&&(f.shown==="all"||it.shown===f.shown)
    &&(!q||[it.name,it.series,it.place,it.memo,it.cat].join(" ").toLowerCase().includes(q)));
  const s=state.sort;
  a.sort((x,y)=>s==="new"?(y.created||0)-(x.created||0):s==="love"?(y.love||0)-(x.love||0)||(x.no-y.no):s==="place"?String(x.place||"ん").localeCompare(String(y.place||"ん"),"ja")||(x.no-y.no):(x.no||0)-(y.no||0));
  return a;
}

  const ac=$("#cats [aria-pressed=true]"),bx=$("#cats"),lk=state.pmode+key;if(ac&&state.lastCat!==lk){state.lastCat=lk;bx.scrollLeft=ac.offsetLeft-bx.clientWidth/2+ac.offsetWidth/2}

  $("#shownf").innerHTML=[["all","ぜんぶ"],["display","飾ってる"],["stored","しまってる"],["use","ふだん使い"]].map(([k,l])=>`<button class="chip" data-s="${k}" aria-pressed="${state.filter.shown===k}">${l}</button>`).join("");

      <p>${none?"ぬい1体からでも、写真をとって登録してみてね":"登録すると、ここに額縁で並びます"}</p>
      <button class="cta" data-addhere>＋ ${name?esc(name)+"を":""}登録する</button></div>`}

/* ---------- 飾るメンバー ---------- */
function placeItems(pl){return live().filter(i=>(i.place||"").trim()===pl)}
function renderDisp(key){const box=$("#dispBox");
  if(state.pmode!=="place"||key==="all"||key==="__none"){box.innerHTML="";return}
  const its=placeItems(key),n=its.filter(i=>i.shown==="display").length,lim=(look.limits||{})[key]||0;
  box.innerHTML=`<div class="dispbox"><span>飾ってる <b class="${lim&&n>lim?"over":""}">${n}</b>${lim?` / ${lim}こまで`:"こ"}</span><button data-rot="${esc(key)}">飾る子を入れかえ</button></div>`}
function ago(t){if(!t)return "まだ飾ったことない";const d=Math.floor((Date.now()-t)/864e5);return d<1?"きょう飾った":d<31?`${d}日前に飾った`:`${Math.floor(d/30)}か月前に飾った`}
function openRotate(pl){const root=$("#sheetRoot");
  const draw=()=>{const its=placeItems(pl),on=its.filter(i=>i.shown==="display"),off=its.filter(i=>i.shown!=="display").sort((a,b)=>(a.dispAt||0)-(b.dispAt||0)),lim=(look.limits||{})[pl]||0;
    const row=(i,isOn)=>{const src=imgSrc(i);return `<li><span class="th">${src?`<img src="${esc(src)}" alt="">`:esc((i.name||"？").slice(0,1))}</span><span class="nm"><b>${esc(i.name)}</b><small>${isOn?"飾ってる":esc(ago(i.dispAt))}</small></span><button class="${isOn?"on":"off"}" data-tg="${esc(i.id)}">${isOn?"しまう":"飾る"}</button></li>`};
    root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rt-t">
      <h2 id="rt-t"><span>${esc(pl)}の飾る子</span><button class="x" id="sh-x" aria-label="閉じる">×</button></h2>
      <div class="field"><span class="lab">ここに飾れる数</span><div class="stepper"><button data-lim="-1" aria-label="へらす">−</button><b>${lim?lim+"こまで":"きめない"}</b><button data-lim="1" aria-label="ふやす">＋</button></div></div>
      <p class="rot-sub">飾ってる（${on.length}${lim?" / "+lim:""}）</p><ul class="rot-list">${on.map(i=>row(i,true)).join("")||'<li style="grid-template-columns:1fr"><small style="color:var(--ink-soft)">まだ誰も飾ってないよ</small></li>'}</ul>
      <p class="rot-sub">しまってる・ほか（ひさしぶりの子が上）</p><ul class="rot-list">${off.map(i=>row(i,false)).join("")||'<li style="grid-template-columns:1fr"><small style="color:var(--ink-soft)">ここにある子はみんな飾ってるよ</small></li>'}</ul>
      <div class="actions" style="margin-top:14px"><span></span><button class="btn-main" id="sh-x2">できた</button></div></div></div>`};
  draw();root.onsubmit=null;root.onchange=null;root.oninput=null;
  root.onclick=async e=>{
    if(e.target.id==="scrim"||e.target.id==="sh-x"||e.target.id==="sh-x2"){root.innerHTML="";return}
    const l=e.target.closest("[data-lim]");if(l){const cur=(look.limits||{})[pl]||0,nv=Math.max(0,Math.min(99,cur+ +l.dataset.lim));await setLook({limits:{...(look.limits||{}),[pl]:nv}});draw();render();return}
    const t=e.target.closest("[data-tg]");if(t){const it=state.items.find(i=>i.id===t.dataset.tg);if(!it)return;
      const toOn=it.shown!=="display",lim=(look.limits||{})[pl]||0,n=placeItems(pl).filter(i=>i.shown==="display").length;
      if(toOn&&lim&&n>=lim){toast("枠がいっぱい。先にしまう子をえらんでね");return}
      try{await saveItem({...it,shown:toOn?"display":"stored",...(toOn?{dispAt:Date.now()}:{})});setTimeout(draw,60)}catch(err){toast("保存できませんでした")}}
  };
}

$("#sortBox").addEventListener("click",async e=>{

        <div class="field"><label for="f-name">なまえ</label><input id="f-name" required maxlength="60" value="${esc(d.name)}" placeholder="例）一期一振のぬい（白）"></div>
        <div class="row2">
          <div class="field"><label for="f-cat">カテゴリ</label><select id="f-cat">${CATS.map(c=>`<option ${c===d.cat?"selected":""}>${c}</option>`).join("")}</select></div>
          <div class="field"><label for="f-series">推し・シリーズ</label><input id="f-series" maxlength="40" value="${esc(d.series)}" placeholder="例）刀剣乱舞"></div>
        </div>
        ${d.wish?(()=>`${simHtml(d)}
        <div class="field"><label for="f-price">お値段（メモ）</label><input id="f-price" maxlength="30" value="${esc(d.price||"")}" placeholder="例）2,200円"></div>`)():`<div class="row2">
          <div class="field"><label for="f-place">置き場所</label><input id="f-place" maxlength="40" list="places" value="${esc(d.place)}" placeholder="例）本棚の上"><datalist id="places">${[...new Set(live().map(i=>i.place).filter(Boolean))].map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>
          <div class="field"><label for="f-since">お迎えした日</label><input id="f-since" type="month" value="${esc(d.since)}"></div>
        </div>`}
        ${d.wish?"":`<div class="field"><span class="lab">置き方</span><div class="seg" data-k="shown">${Object.entries(SHOWN).map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${d.shown===k}">${l}</button>`).join("")}</div></div>
        `}<div class="field"><span class="lab">${d.wish?"ほしい度":"好き度"}</span><div class="hearts" id="hearts">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${n<=d.love?"on":""}" aria-label="好き度${n}">♥</button>`).join("")}</div></div>
        ${d.wish?"":`<div class="field"><span class="lab">いる？いらない？</span><div class="seg j" data-k="judge">${Object.entries(JUDGE).map(([k,l])=>`<button type="button" class="${k}" data-v="${k}" aria-pressed="${(d.judge||"none")===k}">${l}</button>`).join("")}</div></div>`}
        <div class="field"><label for="f-memo">メモ</label><textarea id="f-memo" maxlength="400" placeholder="思い出、どこで買ったか、など">${esc(d.memo)}</textarea></div>
        <div id="cf"></div>
        ${!isNew&&d.wish?`<div class="actions" style="justify-content:flex-start"><button type="button" class="btn-grad" id="gotit" style="background:var(--red);color:#fff;border-color:var(--red)">お迎えした！→ 図鑑へ</button></div>`:""}
        ${!isNew&&d.grad?`<div class="actions" style="justify-content:flex-start"><button type="button" class="btn-grad" id="ungrad">図鑑にもどす</button></div>`:""}
        ${!isNew&&!d.grad&&d.judge==="let"?`<div class="actions" style="justify-content:flex-start"><button type="button" class="btn-grad" id="grad">手放した → 卒業アルバムへ</button></div>`:""}
        <div class="actions">${isNew?"<span></span>":`<button type="button" class="btn-del" id="del">${d.wish?"リストから消す":d.grad?"アルバムから消す":"図鑑から消す"}</button>`}<button class="btn-main" id="save">${isNew?(d.wish?"追加する":"登録する"):"保存する"}</button></div>
      </form></div></div>`;
  };
  const sync=()=>{["name","series","place","since","memo","price"].forEach(k=>{const el=$("#f-"+k);if(el)d[k]=el.value});d.cat=$("#f-cat").value};
  draw();
  root.onclick=async e=>{
    if(e.target.id==="scrim"||e.target.id==="sh-x"){root.innerHTML="";return}
    const seg=e.target.closest(".seg button");if(seg){sync();const k=seg.parentElement.dataset.k;d[k]=(k==="shown"&&d[k]===seg.dataset.v)?"":seg.dataset.v;draw();return}
    const h=e.target.closest(".hearts button");if(h){sync();const n=+h.dataset.n;d.love=d.love===n?0:n;draw();return}
    if(e.target.id==="del"){$("#cf").innerHTML=`<div class="confirm"><span>「${esc(d.name)}」を図鑑から消しますか？</span><span><button type="button" class="no" id="cf-no">やめる</button> <button type="button" class="yes" id="cf-yes">消す</button></span></div>`;return}
    if(e.target.id==="cf-no"){$("#cf").innerHTML="";return}
    if(e.target.id==="trim"){sync();const src=pending?pending.data:imgSrc(d);if(!src)return;const c=await cropPhoto(src);if(c){pending=c;draw()}return}
    if(e.target.id==="gotit"){sync();root.innerHTML="";await gotIt(d);return}
    if(e.target.id==="grad"){sync();root.innerHTML="";await graduate(d);return}
    if(e.target.id==="ungrad"){sync();root.innerHTML="";try{const {grad,gradAt,...rest}=d;await saveItem(rest);toast("図鑑にもどしました")}catch(err){toast("保存できませんでした")}return}
    if(e.target.id==="cf-yes"){try{await removeItem(d.id);root.innerHTML="";toast("消しました")}catch(err){toast("消せませんでした")}return}
  };
  root.onchange=async e=>{
    if(e.target.id!=="f-photo"||!e.target.files[0])return;sync();
    let base;try{base=await shrink(e.target.files[0],1600)}catch(err){toast("この写真は読みこめませんでした");return}
    e.target.value="";const c=await cropPhoto(base.data);pending=c||base;draw()
  };
  root.oninput=e=>{if(!d.wish||!["f-name","f-series","f-cat"].includes(e.target.id))return;clearTimeout(root._st);root._st=setTimeout(()=>{sync();const b=$("#simbox");if(b)b.outerHTML=simHtml(d)},250)};
  root.onsubmit=async e=>{
    e.preventDefault();sync();if(!d.name.trim()){toast("なまえを入れてね");return}
    const btn=$("#save");btn.disabled=true;btn.textContent="保存中…";
    try{
      if(pending){
        if(state.mode==="db"&&state.assets){const r=await state.assets.upload(pending.blob,{});d.photo=r.id;delete d.photoData}
        else{d.photoData=pending.data}
      }
      if(d.shown==="display"&&(!it||it.shown!=="display"))d.dispAt=Date.now();
      await saveItem(d);root.innerHTML="";toast(d.wish?(isNew?"ほしいものリストに追加しました":"保存しました"):isNew?`No.${pad(d.no)} として登録しました`:"保存しました");
    }catch(err){btn.disabled=false;btn.textContent="もう一度保存";toast(err&&err.code==="quota_exceeded"?"写真の容量がいっぱいです。写真なしで保存してみてね":"保存できませんでした。もう一度ためしてね")}
  };
  setTimeout(()=>{const n=$("#f-name");if(n&&isNew)n.focus()},50);
}

/* ---------- イベント ---------- */
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sheetRoot").innerHTML=""});
$("#add").onclick=()=>openSheet(null);

function toggleTools(open){const tp=$("#toolpanel"),o=open??tp.hidden;tp.hidden=!o;$("#gear").setAttribute("aria-expanded",o)}
$("#gear").onclick=()=>toggleTools();
$("#tpClose").onclick=()=>toggleTools(false);
$("#sizes2").onclick=e=>{const b=e.target.closest("[data-cols]");if(b){setLook({cols:+b.dataset.cols});render()}};
$("#tpReset").onclick=()=>{state.filter.q="";state.filter.shown="all";state.sort="no";$("#q").value="";$("#sortby").value="no";render()};
$("#grid").onclick=e=>{const p=e.target.closest(".plate");if(p)openDetail(state.items.find(i=>i.id===p.dataset.id))};
$("#tally").onclick=e=>{const b=e.target.closest("[data-j]");if(b){state.filter.judge=b.dataset.j;render();$("#cats").scrollIntoView({block:"start",behavior:"smooth"})}};
function goPage(c){setKey(c);render();$("#cats").scrollIntoView({block:"start",behavior:"smooth"})}
$("#cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b){setKey(b.dataset.c);render()}};
$("#pmode").onclick=e=>{const b=e.target.closest("[data-m]");if(b&&b.dataset.m!==state.pmode){state.pmode=b.dataset.m;render()}};
$("#dispBox").onclick=e=>{const b=e.target.closest("[data-rot]");if(b)openRotate(b.dataset.rot)};
$("#albumGrid").onclick=e=>{const p=e.target.closest(".plate");if(p)openDetail(state.items.find(i=>i.id===p.dataset.id))};
$("#prevPg").onclick=()=>{const P=pages(),i=P.indexOf(curKey());if(i>0)goPage(P[i-1])};
$("#nextPg").onclick=()=>{const P=pages(),i=P.indexOf(curKey());if(i<P.length-1)goPage(P[i+1])};

$("#emptyBox").onclick=e=>{if(e.target.closest("[data-addhere]"))openSheet(null)};
$("#shownf").onclick=e=>{const b=e.target.closest("[data-s]");if(b){state.filter.shown=b.dataset.s;render()}};
$("#q").oninput=e=>{state.filter.q=e.target.value;render()};
$("#sortby").onchange=e=>{state.sort=e.target.value;render()};
function setTab(t){state.tab=t;["zukan","sort","album","wish","kisekae"].forEach(k=>{$("#tab-"+k).setAttribute("aria-pressed",t===k);$("#view-"+k).hidden=t!==k});
  $("#add").hidden=t!=="zukan";if(t==="sort"){state.sortQueue=null;renderSort()}if(t==="album")renderAlbum();if(t==="wish")renderWish();if(t==="kisekae")openKisekae()}
$("#tab-zukan").onclick=()=>setTab("zukan");$("#tab-sort").onclick=()=>setTab("sort");$("#tab-album").onclick=()=>setTab("album");$("#tab-wish").onclick=()=>setTab("wish");$("#tab-kisekae").onclick=()=>setTab("kisekae");
$("#wishAdd").onclick=()=>openSheet(null,{wish:true});
$("#wishList").onclick=e=>{const g=e.target.closest("[data-got]");if(g){const w=state.items.find(i=>i.id===g.dataset.got);if(w)gotIt(w);return}
  const o=e.target.closest("[data-wid]");if(o)openSheet(state.items.find(i=>i.id===o.dataset.wid))};
boot();
</script>

</body></html>
